# Production stack cho Micro VPS: MySQL + backend + frontend(nginx) + Caddy(HTTPS).
# ML service KHÔNG ở đây — chạy riêng trên Hugging Face Spaces (biến ML_SERVICE_URL).
# Biến lấy từ file .env cùng thư mục (KHÔNG commit) — xem .env.production.example.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-nha-nong}
      CORS_ORIGIN: ${PUBLIC_URL}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:7860}
      ML_TIMEOUT_MS: ${ML_TIMEOUT_MS:-60000}
      DIAGNOSIS_CONFIDENCE_THRESHOLD: ${DIAGNOSIS_CONFIDENCE_THRESHOLD:-0.6}
      PORT: 3000
      NODE_ENV: production
    # Đồng bộ schema (db push) rồi chạy node (không dùng nodemon ở prod)
    command: sh -c "npx prisma db push --accept-data-loss && npm start"
    expose:
      - "3000"

  ml:
    build: ./ml-service
    restart: unless-stopped
    # Cần file model trong ml-service/model/ trên server (xem DEPLOY.md). Chỉ nội bộ, không mở ra ngoài.
    expose:
      - "7860"

  frontend:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
