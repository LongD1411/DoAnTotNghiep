server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không phải file tĩnh -> index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
